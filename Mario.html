<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Super Mario Style Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #69c9ff;
        }

        /* =====================================================
            GAME
        ===================================================== */

        #game {
            width: 100vw;
            height: 100vh;

            position: relative;
            overflow: hidden;

            background: linear-gradient(to bottom,
                    #35aef5 0%,
                    #74d2ff 45%,
                    #bdeeff 100%);
        }

        /* =====================================================
            WORLD
        ===================================================== */

        #world {
            position: absolute;

            width: 5000px;
            height: 100%;

            top: 0;
            left: 0;

            will-change: transform;
        }

        /* =====================================================
            CLOUDS
        ===================================================== */

        .cloud {
            position: absolute;

            width: 150px;
            height: 48px;

            background: linear-gradient(to bottom, #ffffff, #e8f7ff);

            border-radius: 50px;

            filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.08));

            opacity: 0.92;
        }

        .cloud::before {
            content: "";

            position: absolute;

            width: 65px;
            height: 65px;

            background: white;

            border-radius: 50%;

            left: 25px;
            top: -30px;
        }

        .cloud::after {
            content: "";

            position: absolute;

            width: 55px;
            height: 55px;

            background: white;

            border-radius: 50%;

            right: 20px;
            top: -22px;
        }

        /* =====================================================
            PLAYER
        ===================================================== */

        #player {
            position: absolute;

            width: 78px;
            height: 105px;

            z-index: 50;

            pointer-events: none;

            transform-origin: center bottom;

            filter: drop-shadow(0 9px 6px rgba(0, 0, 0, 0.3));

            will-change: transform, left, top;
        }

        #player img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            user-select: none;
            pointer-events: none;
        }

        /* Walking effect */

        #player.walking {
            animation: marioWalk 0.15s infinite alternate;
        }

        @keyframes marioWalk {
            from {
                margin-top: 0;
            }

            to {
                margin-top: -3px;
            }
        }

        /* Jump effect */

        #player.jumping {
            animation: marioJump 0.2s ease-out;
        }

        @keyframes marioJump {
            0% {
                scale: 1;
            }

            50% {
                scale: 1.04 0.97;
            }

            100% {
                scale: 1;
            }
        }

        /* =====================================================
            GROUND
        ===================================================== */

        .ground {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 5000px;
            height: 90px;

            background: linear-gradient(to bottom,
                    #62ad3d 0px,
                    #62ad3d 10px,
                    #754827 10px,
                    #59361f 100%);

            border-top: 7px solid #3b8e2e;

            box-shadow:
                inset 0 8px 0 rgba(255, 255, 255, 0.12),
                inset 0 -15px 20px rgba(0, 0, 0, 0.25);
        }

        .ground::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            top: 18px;
            bottom: 0;

            background-image: radial-gradient(circle,
                    rgba(255, 255, 255, 0.09) 2px,
                    transparent 3px);

            background-size: 35px 35px;

            opacity: 0.5;
        }

        /* =====================================================
            PLATFORMS
        ===================================================== */

        .platform {
            position: absolute;

            height: 32px;

            background: linear-gradient(to bottom, #dc9551, #b86b31 50%, #87471f);

            border: 3px solid #593018;

            border-radius: 5px;

            box-shadow:
                inset 0 4px 0 rgba(255, 255, 255, 0.18),
                inset 0 -5px 0 rgba(0, 0, 0, 0.2),
                0 7px 12px rgba(0, 0, 0, 0.25);
        }

        /* =====================================================
            BLOCKS
        ===================================================== */

        .block {
            position: absolute;

            width: 52px;
            height: 52px;

            display: flex;

            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #ffc64d, #d9771f);

            border: 3px solid #7c4218;

            border-radius: 3px;

            color: white;

            font-size: 29px;
            font-weight: 900;

            text-shadow: 2px 2px 0 #8b4c16;

            box-shadow:
                inset 3px 3px 0 rgba(255, 255, 255, 0.25),
                inset -4px -4px 0 rgba(0, 0, 0, 0.2),
                0 5px 10px rgba(0, 0, 0, 0.2);
        }

        .brick {
            background: linear-gradient(135deg, #c87532, #8e451d);
        }

        /* =====================================================
            PIPES
        ===================================================== */

        .pipe {
            position: absolute;

            width: 76px;

            background: linear-gradient(90deg,
                    #075b2b 0%,
                    #0c9d43 25%,
                    #2bc95e 50%,
                    #0c963f 75%,
                    #075b2b 100%);

            border: 4px solid #064a25;

            border-radius: 5px 5px 0 0;

            bottom: 90px;

            box-shadow:
                inset 8px 0 10px rgba(255, 255, 255, 0.15),
                8px 0 15px rgba(0, 0, 0, 0.25);
        }

        .pipe::before {
            content: "";

            position: absolute;

            width: 96px;
            height: 25px;

            left: -14px;
            top: -4px;

            background: linear-gradient(90deg, #075b2b, #2bc95e, #0b8e3c);

            border: 4px solid #064a25;

            border-radius: 6px;

            box-shadow: inset 0 4px 5px rgba(255, 255, 255, 0.2);
        }

        /* =====================================================
            ENEMY
        ===================================================== */

        .enemy {
            position: absolute;

            width: 50px;
            height: 44px;

            background: radial-gradient(circle at 30% 25%, #a96843, #713b24 65%);

            border: 3px solid #382016;

            border-radius: 50% 50% 25% 25%;

            box-shadow: 0 7px 8px rgba(0, 0, 0, 0.25);

            z-index: 30;
        }

        .enemy::before {
            content: "";

            position: absolute;

            width: 9px;
            height: 9px;

            background: white;

            border-radius: 50%;

            left: 10px;
            top: 12px;

            box-shadow: 20px 0 white;
        }

        .enemy::after {
            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            background: #111;

            border-radius: 50%;

            left: 13px;
            top: 15px;

            box-shadow: 20px 0 #111;
        }

        /* =====================================================
            COINS
        ===================================================== */

        .coin {
            position: absolute;

            width: 30px;
            height: 38px;

            border-radius: 50%;

            background: linear-gradient(90deg,
                    #b87900,
                    #ffe44a 25%,
                    #fff27a 50%,
                    #e5a900 75%,
                    #9d6900);

            border: 3px solid #a16d00;

            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.25),
                inset 3px 0 4px rgba(255, 255, 255, 0.5);

            animation: coinSpin 0.7s ease-in-out infinite alternate;

            z-index: 10;
        }

        @keyframes coinSpin {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0.25);
            }
        }

        /* =====================================================
            FLAG
        ===================================================== */

        .flag-pole {
            position: absolute;

            width: 8px;
            height: 300px;

            bottom: 90px;

            background: linear-gradient(to right, #444, #aaa, #444);

            box-shadow: 4px 0 8px rgba(0, 0, 0, 0.25);
        }

        .flag {
            position: absolute;

            width: 90px;
            height: 55px;

            left: 8px;
            top: 10px;

            background: linear-gradient(to bottom, #ff4b4b, #c91515);

            clip-path: polygon(0 0, 100% 25%, 0 50%);
        }

        /* =====================================================
            HUD
        ===================================================== */

        #hud {
            position: fixed;

            top: 20px;
            left: 20px;

            z-index: 200;

            color: white;

            font-size: 19px;
            font-weight: 800;

            background: rgba(0, 0, 0, 0.65);

            padding: 12px 18px;

            border-radius: 10px;

            backdrop-filter: blur(8px);

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        /* =====================================================
            CONTROLS
        ===================================================== */

        #controls {
            position: fixed;

            bottom: 20px;
            left: 20px;

            z-index: 200;

            color: white;

            padding: 10px 15px;

            background: rgba(0, 0, 0, 0.55);

            border-radius: 8px;
        }

        /* =====================================================
            GAME MESSAGE
        ===================================================== */

        #message {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 500;

            display: none;

            min-width: 330px;

            text-align: center;

            color: white;

            background: rgba(0, 0, 0, 0.88);

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        #message h1 {
            margin-bottom: 12px;
        }

        #message button {
            margin-top: 20px;

            padding: 11px 28px;

            border: none;

            border-radius: 7px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            background: #ffd21f;
        }
    </style>
</head>

<body>
    <div id="game">
        <div id="hud">
            SCORE:
            <span id="score">0</span>

            &nbsp;&nbsp; COINS:
            <span id="coins">0</span>

            &nbsp;&nbsp; LIVES:
            <span id="lives">3</span>
        </div>

        <div id="controls">← → Move &nbsp;&nbsp; ↑ Jump</div>

        <div id="message">
            <h1 id="messageTitle">Game Over</h1>

            <p id="messageText">Try again!</p>

            <button onclick="restartGame()">Restart</button>
        </div>

        <div id="world">
            <!-- ===============================================
            MARIO
        ================================================ -->

            <div id="player">
                <img src="mario.png" alt="Mario" />
            </div>

            <!-- ===============================================
            CLOUDS
        ================================================ -->

            <div class="cloud" style="left: 300px; top: 80px"></div>

            <div class="cloud" style="left: 1100px; top: 130px"></div>

            <div class="cloud" style="left: 2100px; top: 70px"></div>

            <div class="cloud" style="left: 3300px; top: 120px"></div>

            <!-- ===============================================
            GROUND
        ================================================ -->

            <div class="ground"></div>

            <!-- ===============================================
            PLATFORMS
        ================================================ -->

            <div class="platform" style="left: 400px; bottom: 220px; width: 220px"></div>

            <div class="platform" style="left: 800px; bottom: 320px; width: 180px"></div>

            <div class="platform" style="left: 1200px; bottom: 190px; width: 250px"></div>

            <div class="platform" style="left: 1700px; bottom: 280px; width: 200px"></div>

            <div class="platform" style="left: 2300px; bottom: 220px; width: 300px"></div>

            <div class="platform" style="left: 3000px; bottom: 330px; width: 220px"></div>

            <!-- ===============================================
            BLOCKS
        ================================================ -->

            <div class="block" style="left: 650px; bottom: 350px">?</div>

            <div class="block brick" style="left: 702px; bottom: 350px"></div>

            <div class="block" style="left: 754px; bottom: 350px">?</div>

            <div class="block brick" style="left: 1300px; bottom: 270px"></div>

            <div class="block brick" style="left: 1352px; bottom: 270px"></div>

            <!-- ===============================================
            PIPES
        ================================================ -->

            <div class="pipe" style="left: 1500px; height: 140px"></div>

            <div class="pipe" style="left: 2800px; height: 190px"></div>

            <div class="pipe" style="left: 3600px; height: 130px"></div>

            <!-- ===============================================
            COINS
        ================================================ -->

            <div class="coin" data-coin style="left: 470px; bottom: 280px"></div>

            <div class="coin" data-coin style="left: 520px; bottom: 280px"></div>

            <div class="coin" data-coin style="left: 850px; bottom: 380px"></div>

            <div class="coin" data-coin style="left: 900px; bottom: 380px"></div>

            <div class="coin" data-coin style="left: 1250px; bottom: 250px"></div>

            <div class="coin" data-coin style="left: 1750px; bottom: 340px"></div>

            <div class="coin" data-coin style="left: 2400px; bottom: 270px"></div>

            <div class="coin" data-coin style="left: 3050px; bottom: 390px"></div>

            <!-- ===============================================
            ENEMIES
        ================================================ -->

            <div class="enemy" data-enemy style="left: 1000px; bottom: 90px"></div>

            <div class="enemy" data-enemy style="left: 1600px; bottom: 90px"></div>

            <div class="enemy" data-enemy style="left: 2150px; bottom: 90px"></div>

            <div class="enemy" data-enemy style="left: 2700px; bottom: 90px"></div>

            <div class="enemy" data-enemy style="left: 3400px; bottom: 90px"></div>

            <!-- ===============================================
            FINISH
        ================================================ -->

            <div class="flag-pole" style="left: 4400px">
                <div class="flag"></div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
    DOM
  ========================================================= */

        const game = document.getElementById("game");

        const world = document.getElementById("world");

        const playerElement = document.getElementById("player");

        const scoreElement = document.getElementById("score");

        const coinsElement = document.getElementById("coins");

        const livesElement = document.getElementById("lives");

        const message = document.getElementById("message");

        const messageTitle = document.getElementById("messageTitle");

        const messageText = document.getElementById("messageText");

        /* =========================================================
    PLAYER
  ========================================================= */

        const player = {
            x: 100,

            y: 0,

            /*
            Visual Mario is 78x105.
    
            Collision box is intentionally
            smaller than the image.
        */

            width: 42,

            height: 72,

            velocityX: 0,

            velocityY: 0,

            speed: 7,

            jumpForce: 17,

            gravity: 0.75,

            grounded: false,

            facing: 1,
        };

        /* =========================================================
    GAME VARIABLES
  ========================================================= */

        let score = 0;

        let coins = 0;

        let lives = 3;

        let gameRunning = true;

        let cameraCurrent = 0;

        /* =========================================================
    INPUT
  ========================================================= */

        const keys = {
            left: false,

            right: false,

            jump: false,
        };

        window.addEventListener("keydown", function (event) {
            if (
                event.key === "ArrowLeft" ||
                event.key === "ArrowRight" ||
                event.key === "ArrowUp"
            ) {
                event.preventDefault();
            }

            if (event.key === "ArrowLeft") {
                keys.left = true;

                player.facing = -1;
            }

            if (event.key === "ArrowRight") {
                keys.right = true;

                player.facing = 1;
            }

            if (event.key === "ArrowUp") {
                keys.jump = true;
            }
        });

        window.addEventListener("keyup", function (event) {
            if (event.key === "ArrowLeft") {
                keys.left = false;
            }

            if (event.key === "ArrowRight") {
                keys.right = false;
            }

            if (event.key === "ArrowUp") {
                keys.jump = false;
            }
        });

        /* =========================================================
    PLAYER RECTANGLE
  ========================================================= */

        function getPlayerRect() {
            return {
                left: player.x,

                right: player.x + player.width,

                top: player.y,

                bottom: player.y + player.height,
            };
        }

        /* =========================================================
    WORLD RECTANGLE
  ========================================================= */

        function getWorldRect(element) {
            const style = window.getComputedStyle(element);

            const left = parseFloat(style.left) || 0;

            const width = element.offsetWidth;

            const height = element.offsetHeight;

            let top;

            if (style.top !== "auto") {
                top = parseFloat(style.top);
            } else {
                const bottom = parseFloat(style.bottom) || 0;

                top = game.clientHeight - bottom - height;
            }

            return {
                left: left,

                right: left + width,

                top: top,

                bottom: top + height,
            };
        }

        /* =========================================================
    RECTANGLE COLLISION
  ========================================================= */

        function rectanglesOverlap(a, b) {
            return (
                a.left < b.right &&
                a.right > b.left &&
                a.top < b.bottom &&
                a.bottom > b.top
            );
        }

        /* =========================================================
    INPUT
  ========================================================= */

        function handleInput() {
            player.velocityX = 0;

            if (keys.left) {
                player.velocityX = -player.speed;
            }

            if (keys.right) {
                player.velocityX = player.speed;
            }

            /*
            Jump
        */

            if (keys.jump && player.grounded) {
                player.velocityY = -player.jumpForce;

                player.grounded = false;

                keys.jump = false;

                playerElement.classList.add("jumping");

                setTimeout(() => {
                    playerElement.classList.remove("jumping");
                }, 200);
            }
        }

        /* =========================================================
    HORIZONTAL MOVEMENT
  ========================================================= */

        function updateHorizontalMovement() {
            player.x += player.velocityX;

            if (player.x < 0) {
                player.x = 0;
            }

            const worldWidth = 5000;

            if (player.x + player.width > worldWidth) {
                player.x = worldWidth - player.width;
            }
        }

        /* =========================================================
    VERTICAL PHYSICS
  ========================================================= */

        function updateVerticalMovement() {
            const previousBottom = player.y + player.height;

            player.velocityY += player.gravity;

            player.y += player.velocityY;

            player.grounded = false;

            /*
            Ground
        */

            const groundTop = game.clientHeight - 90;

            if (player.y + player.height >= groundTop) {
                player.y = groundTop - player.height;

                player.velocityY = 0;

                player.grounded = true;
            }

            /*
            Platforms / Blocks / Pipes
        */

            const platforms = document.querySelectorAll(".platform, .block, .pipe");

            const currentRect = getPlayerRect();

            platforms.forEach(function (element) {
                const rect = getWorldRect(element);

                const horizontalCollision =
                    currentRect.right > rect.left && currentRect.left < rect.right;

                const landing =
                    player.velocityY >= 0 &&
                    previousBottom <= rect.top &&
                    currentRect.bottom >= rect.top;

                if (horizontalCollision && landing) {
                    player.y = rect.top - player.height;

                    player.velocityY = 0;

                    player.grounded = true;
                }
            });
        }

        /* =========================================================
    ENEMIES
  ========================================================= */

        function updateEnemies() {
            const enemies = document.querySelectorAll(".enemy");

            enemies.forEach(function (enemy) {
                if (enemy.dataset.dead === "true") {
                    return;
                }

                let x = parseFloat(enemy.style.left);

                let direction = Number(enemy.dataset.direction || 1);

                if (!enemy.dataset.startX) {
                    enemy.dataset.startX = x;
                }

                const startX = Number(enemy.dataset.startX);

                const speed = 1.5;

                x += speed * direction;

                if (x > startX + 130) {
                    direction = -1;
                }

                if (x < startX - 130) {
                    direction = 1;
                }

                enemy.dataset.direction = direction;

                enemy.style.left = x + "px";
            });
        }

        /* =========================================================
    ENEMY COLLISION
  ========================================================= */

        function checkEnemyCollision() {
            const enemies = document.querySelectorAll(".enemy");

            const playerRect = getPlayerRect();

            enemies.forEach(function (enemy) {
                if (enemy.dataset.dead === "true") {
                    return;
                }

                const enemyRect = getWorldRect(enemy);

                if (rectanglesOverlap(playerRect, enemyRect)) {
                    /*
                        Stomp enemy
                        */

                    if (
                        player.velocityY > 0 &&
                        playerRect.bottom - player.velocityY <= enemyRect.top + 15
                    ) {
                        killEnemy(enemy);
                    } else {
                        hurtPlayer();
                    }
                }
            });
        }

        /* =========================================================
    KILL ENEMY
  ========================================================= */

        function killEnemy(enemy) {
            enemy.dataset.dead = "true";

            enemy.style.transform = "scaleY(0.25)";

            score += 100;

            updateHUD();

            setTimeout(function () {
                enemy.remove();
            }, 250);
        }

        /* =========================================================
    DAMAGE
  ========================================================= */

        function hurtPlayer() {
            if (!gameRunning) {
                return;
            }

            lives--;

            updateHUD();

            if (lives <= 0) {
                gameOver();

                return;
            }

            /*
            Respawn
        */

            player.x = Math.max(100, player.x - 300);

            player.y = 100;

            player.velocityX = 0;

            player.velocityY = 0;
        }

        /* =========================================================
    COINS
  ========================================================= */

        function checkCoins() {
            const coinElements = document.querySelectorAll("[data-coin]");

            const playerRect = getPlayerRect();

            coinElements.forEach(function (coin) {
                if (coin.dataset.collected === "true") {
                    return;
                }

                const coinRect = getWorldRect(coin);

                if (rectanglesOverlap(playerRect, coinRect)) {
                    coin.dataset.collected = "true";

                    coin.style.display = "none";

                    coins++;

                    score += 50;

                    updateHUD();
                }
            });
        }

        /* =========================================================
    CAMERA
  ========================================================= */

        function updateCamera() {
            const screenCenter = game.clientWidth / 2;

            let targetCamera = player.x - screenCenter;

            const maxCamera = 5000 - game.clientWidth;

            targetCamera = Math.max(0, Math.min(targetCamera, maxCamera));

            /*
            Smooth camera
        */

            cameraCurrent += (targetCamera - cameraCurrent) * 0.12;

            world.style.transform = `translate3d(
            ${-cameraCurrent}px,
            0,
            0
        )`;
        }

        /* =========================================================
    FINISH
  ========================================================= */

        function checkFinish() {
            if (player.x >= 4350) {
                levelComplete();
            }
        }

        /* =========================================================
    HUD
  ========================================================= */

        function updateHUD() {
            scoreElement.textContent = score;

            coinsElement.textContent = coins;

            livesElement.textContent = lives;
        }

        /* =========================================================
    RENDER PLAYER
  ========================================================= */

        function renderPlayer() {
            playerElement.style.left = player.x + "px";

            playerElement.style.top = player.y + "px";

            /*
            Walking animation
        */

            if (player.velocityX !== 0 && player.grounded) {
                playerElement.classList.add("walking");
            } else {
                playerElement.classList.remove("walking");
            }

            /*
            Face direction
        */

            if (player.facing === -1) {
                playerElement.style.transform = "scaleX(-1)";
            } else {
                playerElement.style.transform = "scaleX(1)";
            }
        }

        /* =========================================================
    GAME OVER
  ========================================================= */

        function gameOver() {
            gameRunning = false;

            messageTitle.textContent = "GAME OVER";

            messageText.textContent = "Score: " + score;

            message.style.display = "block";
        }

        /* =========================================================
    LEVEL COMPLETE
  ========================================================= */

        function levelComplete() {
            if (!gameRunning) {
                return;
            }

            gameRunning = false;

            messageTitle.textContent = "LEVEL COMPLETE!";

            messageText.textContent = "Score: " + score + " | Coins: " + coins;

            message.style.display = "block";
        }

        /* =========================================================
    RESTART
  ========================================================= */

        function restartGame() {
            location.reload();
        }

        /* =========================================================
    UPDATE
  ========================================================= */

        function update() {
            handleInput();

            updateHorizontalMovement();

            updateVerticalMovement();

            updateEnemies();

            checkEnemyCollision();

            checkCoins();

            checkFinish();

            updateCamera();
        }

        /* =========================================================
    GAME LOOP
  ========================================================= */

        function gameLoop() {
            if (gameRunning) {
                update();

                renderPlayer();
            }

            requestAnimationFrame(gameLoop);
        }

        /* =========================================================
    START
  ========================================================= */

        function startGame() {
