<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mario Platform Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* =========================================================
   GAME
========================================================= */

#game {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;

    background: linear-gradient(
        to bottom,
        #48bdf5 0%,
        #8bdcff 60%,
        #d8f5ff 100%
    );
}

/* =========================================================
   WORLD
========================================================= */

#world {
    position: absolute;

    width: 5000px;
    height: 100%;

    left: 0;
    top: 0;
}

/* =========================================================
   CLOUDS
========================================================= */

.cloud {
    position: absolute;

    width: 150px;
    height: 45px;

    background: white;

    border-radius: 50px;

    opacity: 0.9;
}

.cloud::before {
    content: "";

    position: absolute;

    width: 65px;
    height: 65px;

    left: 25px;
    top: -30px;

    background: white;

    border-radius: 50%;
}

.cloud::after {
    content: "";

    position: absolute;

    width: 55px;
    height: 55px;

    right: 20px;
    top: -23px;

    background: white;

    border-radius: 50%;
}

/* =========================================================
   MARIO
========================================================= */

#player {
    position: absolute;

    width: 64px;
    height: 110px;

    z-index: 100;

    pointer-events: none;

    transform-origin: center bottom;
}

/* ---------------------------------------------------------
   HAT
--------------------------------------------------------- */

.mario-hat {
    position: absolute;

    width: 48px;
    height: 21px;

    left: 8px;
    top: 1px;

    background: #e52521;

    border: 3px solid #9d1111;

    border-radius: 25px 25px 7px 7px;

    z-index: 7;
}

.mario-hat::before {
    content: "";

    position: absolute;

    width: 30px;
    height: 9px;

    left: -7px;
    bottom: -4px;

    background: #e52521;

    border-radius: 50%;

    border-bottom: 3px solid #9d1111;
}

.mario-hat::after {
    content: "M";

    position: absolute;

    width: 20px;
    height: 20px;

    left: 13px;
    top: -1px;

    color: white;

    font-size: 15px;
    font-weight: 900;

    text-align: center;
}

/* ---------------------------------------------------------
   HEAD
--------------------------------------------------------- */

.mario-head {
    position: absolute;

    width: 39px;
    height: 43px;

    left: 13px;
    top: 13px;

    background: #f2b27f;

    border: 2px solid #914c2f;

    border-radius: 45%;

    z-index: 5;
}

/* ---------------------------------------------------------
   EAR
--------------------------------------------------------- */

.mario-head::before {
    content: "";

    position: absolute;

    width: 10px;
    height: 16px;

    left: -7px;
    top: 17px;

    background: #f2b27f;

    border: 2px solid #914c2f;

    border-radius: 50%;
}

/* ---------------------------------------------------------
   EYE
--------------------------------------------------------- */

.mario-eye {
    position: absolute;

    width: 6px;
    height: 10px;

    right: 6px;
    top: 13px;

    background: #111;

    border-radius: 50%;
}

/* ---------------------------------------------------------
   NOSE
--------------------------------------------------------- */

.mario-head::after {
    content: "";

    position: absolute;

    width: 13px;
    height: 13px;

    right: -5px;
    top: 22px;

    background: #f2b27f;

    border-radius: 50%;

    border-right: 2px solid #914c2f;
}

/* ---------------------------------------------------------
   MUSTACHE
--------------------------------------------------------- */

.mario-mustache {
    position: absolute;

    width: 24px;
    height: 10px;

    right: 0;
    bottom: 7px;

    background: #301b12;

    border-radius: 50%;
}

/* ---------------------------------------------------------
   BODY
--------------------------------------------------------- */

.mario-body {
    position: absolute;

    width: 43px;
    height: 40px;

    left: 10px;
    top: 51px;

    background: #e52521;

    border: 3px solid #9d1111;

    border-radius: 11px 11px 5px 5px;

    z-index: 4;
}

/* Blue overalls */

.mario-body::before {
    content: "";

    position: absolute;

    width: 37px;
    height: 23px;

    left: 0px;
    bottom: -2px;

    background: #1769aa;

    border-radius: 5px;

    border-top: 3px solid #0d4773;
}

/* Overall buttons */

.mario-body::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    left: 8px;
    bottom: 12px;

    background: #ffd42a;

    border-radius: 50%;

    box-shadow: 18px 0 #ffd42a;
}

/* ---------------------------------------------------------
   ARMS
--------------------------------------------------------- */

.mario-arm {
    position: absolute;

    width: 13px;
    height: 35px;

    top: 52px;

    background: #f2b27f;

    border: 2px solid #914c2f;

    border-radius: 12px;

    z-index: 2;
}

.mario-arm.left {
    left: 0;

    transform: rotate(20deg);
}

.mario-arm.right {
    right: 0;

    transform: rotate(-20deg);
}

/* ---------------------------------------------------------
   WHITE GLOVES
--------------------------------------------------------- */

.mario-arm.left::after,
.mario-arm.right::after {
    content: "";

    position: absolute;

    width: 14px;
    height: 12px;

    bottom: -6px;

    background: white;

    border: 2px solid #bbb;

    border-radius: 50%;
}

/* ---------------------------------------------------------
   LEGS
--------------------------------------------------------- */

.mario-leg {
    position: absolute;

    width: 15px;
    height: 29px;

    top: 84px;

    background: #1769aa;

    border-radius: 4px;

    z-index: 2;
}

.mario-leg.left {
    left: 15px;
}

.mario-leg.right {
    right: 15px;
}

/* ---------------------------------------------------------
   SHOES
--------------------------------------------------------- */

.mario-shoe {
    position: absolute;

    width: 25px;
    height: 12px;

    top: 98px;

    background: #703719;

    border: 2px solid #4b2311;

    border-radius: 12px;

    z-index: 5;
}

.mario-shoe.left {
    left: 3px;
}

.mario-shoe.right {
    right: 3px;
}

/* =========================================================
   WALKING ANIMATION
========================================================= */

#player.walking .mario-leg.left {
    animation: leftLeg 0.16s infinite alternate;
}

#player.walking .mario-leg.right {
    animation: rightLeg 0.16s infinite alternate;
}

#player.walking .mario-arm.left {
    animation: leftArm 0.16s infinite alternate;
}

#player.walking .mario-arm.right {
    animation: rightArm 0.16s infinite alternate;
}

@keyframes leftLeg {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(5px);
    }
}

@keyframes rightLeg {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-5px);
    }
}

@keyframes leftArm {
    from {
        transform: rotate(20deg);
    }

    to {
        transform: rotate(-15deg);
    }
}

@keyframes rightArm {
    from {
        transform: rotate(-20deg);
    }

    to {
        transform: rotate(15deg);
    }
}

/* =========================================================
   JUMP
========================================================= */

#player.jumping {
    animation: jumpAnimation 0.2s ease-out;
}

@keyframes jumpAnimation {
    0% {
        scale: 1;
    }

    50% {
        scale: 1.08 0.92;
    }

    100% {
        scale: 1;
    }
}

/* =========================================================
   GROUND
========================================================= */

.ground {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 5000px;
    height: 90px;

    background:
        linear-gradient(
            to bottom,
            #5eaa39 0px,
            #5eaa39 10px,
            #754827 10px,
            #59361f 100%
        );

    border-top: 7px solid #3b8e2e;
}

/* =========================================================
   PLATFORMS
========================================================= */

.platform {
    position: absolute;

    height: 32px;

    background:
        linear-gradient(
            to bottom,
            #dc9551,
            #b86b31,
            #87471f
        );

    border: 3px solid #593018;

    border-radius: 5px;

    box-shadow:
        0 6px 8px rgba(0,0,0,0.2);
}

/* =========================================================
   BLOCKS
========================================================= */

.block {
    position: absolute;

    width: 52px;
    height: 52px;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            135deg,
            #ffc64d,
            #d9771f
        );

    border: 3px solid #7c4218;

    color: white;

    font-size: 29px;
    font-weight: bold;

    text-shadow:
        2px 2px #8b4c16;
}

.brick {
    background:
        linear-gradient(
            135deg,
            #c87532,
            #8e451d
        );
}

/* =========================================================
   PIPES
========================================================= */

.pipe {
    position: absolute;

    width: 76px;

    background:
        linear-gradient(
            90deg,
            #075b2b,
            #0c9d43,
            #2bc95e,
            #0c963f,
            #075b2b
        );

    border: 4px solid #064a25;

    bottom: 90px;

    border-radius: 5px 5px 0 0;
}

.pipe::before {
    content: "";

    position: absolute;

    width: 96px;
    height: 25px;

    left: -14px;
    top: -4px;

    background:
        linear-gradient(
            90deg,
            #075b2b,
            #2bc95e,
            #0b8e3c
        );

    border: 4px solid #064a25;

    border-radius: 6px;
}

/* =========================================================
   ENEMY
========================================================= */

.enemy {
    position: absolute;

    width: 50px;
    height: 44px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #a96843,
            #713b24
        );

    border: 3px solid #382016;

    border-radius:
        50% 50% 25% 25%;

    z-index: 30;
}

.enemy::before {
    content: "";

    position: absolute;

    width: 9px;
    height: 9px;

    left: 10px;
    top: 12px;

    background: white;

    border-radius: 50%;

    box-shadow:
        20px 0 white;
}

.enemy::after {
    content: "";

    position: absolute;

    width: 5px;
    height: 5px;

    left: 13px;
    top: 15px;

    background: black;

    border-radius: 50%;

    box-shadow:
        20px 0 black;
}

/* =========================================================
   COINS
========================================================= */

.coin {
    position: absolute;

    width: 30px;
    height: 38px;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            #b87900,
            #ffe44a,
            #fff27a,
            #e5a900
        );

    border: 3px solid #a16d00;

    animation:
        coinSpin
        0.7s
        ease-in-out
        infinite
        alternate;

    z-index: 10;
}

@keyframes coinSpin {
    from {
        transform: scaleX(1);
    }

    to {
        transform: scaleX(0.25);
    }
}

/* =========================================================
   FLAG
========================================================= */

.flag-pole {
    position: absolute;

    width: 8px;
    height: 300px;

    bottom: 90px;

    background:
        linear-gradient(
            to right,
            #444,
            #aaa,
            #444
        );
}

.flag {
    position: absolute;

    width: 90px;
    height: 55px;

    left: 8px;
    top: 10px;

    background:
        linear-gradient(
            to bottom,
            #ff4b4b,
            #c91515
        );

    clip-path:
        polygon(
            0 0,
            100% 25%,
            0 50%
        );
}

/* =========================================================
   HUD
========================================================= */

#hud {
    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 200;

    color: white;

    font-size: 19px;
    font-weight: 800;

    background:
        rgba(0,0,0,0.65);

    padding: 12px 18px;

    border-radius: 10px;

    backdrop-filter: blur(8px);
}

/* =========================================================
   CONTROLS
========================================================= */

#controls {
    position: fixed;

    bottom: 20px;
    left: 20px;

    z-index: 200;

    color: white;

    padding: 10px 15px;

    background:
        rgba(0,0,0,0.55);

    border-radius: 8px;
}

/* =========================================================
   MESSAGE
========================================================= */

#message {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 500;

    display: none;

    min-width: 330px;

    text-align: center;

    color: white;

    background:
        rgba(0,0,0,0.88);

    padding: 35px;

    border-radius: 15px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.45);
}

#message h1 {
    margin-bottom: 12px;
}

#message button {
    margin-top: 20px;

    padding: 11px 28px;

    border: none;

    border-radius: 7px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    background: #ffd21f;
}
</style>
</head>

<script>

/* =========================================================
   DOM
========================================================= */

const game =
    document.getElementById("game");

const world =
    document.getElementById("world");

const playerElement =
    document.getElementById("player");

const scoreElement =
    document.getElementById("score");

const coinsElement =
    document.getElementById("coins");

const livesElement =
    document.getElementById("lives");

const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 100,

    y: 0,

    width: 52,

    height: 105,

    velocityX: 0,

    velocityY: 0,

    speed: 7,

    jumpForce: 17,

    gravity: 0.75,

    grounded: false,

    facing: 1
};


/* =========================================================
   GAME STATE
========================================================= */

let score = 0;

let coins = 0;

let lives = 3;

let gameRunning = true;

let cameraCurrent = 0;


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {

    left: false,

    right: false,

    jump: false
};


window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight" ||
            event.key === "ArrowUp" ||
            event.code === "Space"
        ) {

            event.preventDefault();
        }


        if (
            event.key === "ArrowLeft"
        ) {

            keys.left = true;

            player.facing = -1;
        }


        if (
            event.key === "ArrowRight"
        ) {

            keys.right = true;

            player.facing = 1;
        }


        if (
            event.key === "ArrowUp" ||
            event.code === "Space"
        ) {

            keys.jump = true;
        }

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key === "ArrowLeft"
        ) {

            keys.left = false;
        }


        if (
            event.key === "ArrowRight"
        ) {

            keys.right = false;
        }


        if (
            event.key === "ArrowUp" ||
            event.code === "Space"
        ) {

            keys.jump = false;
        }

    }
);


/* =========================================================
   PLAYER RECTANGLE
========================================================= */

function getPlayerRect() {

    return {

        left: player.x,

        right:
            player.x +
            player.width,

        top: player.y,

        bottom:
            player.y +
            player.height
    };
}


/* =========================================================
   WORLD ELEMENT RECTANGLE
========================================================= */

function getWorldRect(element) {

    const style =
        window.getComputedStyle(element);

    const left =
        parseFloat(style.left) || 0;

    const width =
        element.offsetWidth;

    const height =
        element.offsetHeight;

    let top;


    if (
        style.top !== "auto"
    ) {

        top =
            parseFloat(style.top);

    } else {

        const bottom =
            parseFloat(style.bottom) || 0;

        top =
            game.clientHeight -
            bottom -
            height;
    }


    return {

        left: left,

        right:
            left + width,

        top: top,

        bottom:
            top + height
    };
}


/* =========================================================
   COLLISION
========================================================= */

function rectanglesOverlap(a, b) {

    return (

        a.left < b.right &&

        a.right > b.left &&

        a.top < b.bottom &&

        a.bottom > b.top
    );
}


/* =========================================================
   INPUT
========================================================= */

function handleInput() {

    player.velocityX = 0;


    if (keys.left) {

        player.velocityX =
            -player.speed;
    }


    if (keys.right) {

        player.velocityX =
            player.speed;
    }


    /* Jump */

    if (
        keys.jump &&
        player.grounded
    ) {

        player.velocityY =
            -player.jumpForce;

        player.grounded = false;

        keys.jump = false;


        playerElement.classList.add(
            "jumping"
        );


        setTimeout(
            function() {

                playerElement.classList.remove(
                    "jumping"
                );

            },
            200
        );
    }
}


/* =========================================================
   HORIZONTAL MOVEMENT
========================================================= */

function updateHorizontalMovement() {

    player.x +=
        player.velocityX;


    if (
        player.x < 0
    ) {

        player.x = 0;
    }


    if (
        player.x +
        player.width >
        5000
    ) {

        player.x =
            5000 -
            player.width;
    }
}


/* =========================================================
   VERTICAL MOVEMENT
========================================================= */

function updateVerticalMovement() {

    const previousBottom =
        player.y +
        player.height;


    player.velocityY +=
        player.gravity;


    player.y +=
        player.velocityY;


    player.grounded = false;


    /* Ground */

    const groundTop =
        game.clientHeight -
        90;


    if (
        player.y +
        player.height >=
        groundTop
    ) {

        player.y =
            groundTop -
            player.height;

        player.velocityY = 0;

        player.grounded = true;
    }


    /* Platforms */

    const platforms =
        document.querySelectorAll(
            ".platform, .block, .pipe"
        );


    const currentRect =
        getPlayerRect();


    platforms.forEach(
        function(element) {

            const rect =
                getWorldRect(element);


            const horizontalCollision =
                currentRect.right >
                    rect.left &&
                currentRect.left <
                    rect.right;


            const landing =

                player.velocityY >= 0 &&

                previousBottom <=
                    rect.top &&

                currentRect.bottom >=
                    rect.top;


            if (
                horizontalCollision &&
                landing
            ) {

                player.y =
                    rect.top -
                    player.height;

                player.velocityY = 0;

                player.grounded = true;
            }

        }
    );
}


/* =========================================================
   ENEMIES
========================================================= */

function updateEnemies() {

    const enemies =
        document.querySelectorAll(
            ".enemy"
        );


    enemies.forEach(
        function(enemy) {

            if (
                enemy.dataset.dead ===
                "true"
            ) {

                return;
            }


            let x =
                parseFloat(
                    enemy.style.left
                );


            let direction =
                Number(
                    enemy.dataset.direction ||
                    1
                );


            if (
                !enemy.dataset.startX
            ) {

                enemy.dataset.startX =
                    x;
            }


            const startX =
                Number(
                    enemy.dataset.startX
                );


            x +=
                1.5 *
                direction;


            if (
                x >
                startX + 130
            ) {

                direction = -1;
            }


            if (
                x <
                startX - 130
            ) {

                direction = 1;
            }


            enemy.dataset.direction =
                direction;

            enemy.style.left =
                x + "px";

        }
    );
}


/* =========================================================
   ENEMY COLLISION
========================================================= */

function checkEnemyCollision() {

    const enemies =
        document.querySelectorAll(
            ".enemy"
        );


    const playerRect =
        getPlayerRect();


    enemies.forEach(
        function(enemy) {

            if (
                enemy.dataset.dead ===
                "true"
            ) {

                return;
            }


            const enemyRect =
                getWorldRect(enemy);


            if (
                rectanglesOverlap(
                    playerRect,
                    enemyRect
                )
            ) {

                /* Stomp */

                if (
                    player.velocityY > 0 &&
                    playerRect.bottom -
                    player.velocityY <=
                    enemyRect.top + 15
                ) {

                    killEnemy(enemy);

                } else {

                    hurtPlayer();
                }
            }

        }
    );
}


/* =========================================================
   KILL ENEMY
========================================================= */

function killEnemy(enemy) {

    enemy.dataset.dead =
        "true";

    enemy.style.transform =
        "scaleY(0.25)";


    score += 100;

    updateHUD();


    setTimeout(
        function() {

            enemy.remove();

        },
        250
    );
}


/* =========================================================
   PLAYER DAMAGE
========================================================= */

function hurtPlayer() {

    if (!gameRunning) {

        return;
    }


    lives--;

    updateHUD();


    if (
        lives <= 0
    ) {

        gameOver();

        return;
    }


    player.x =
        Math.max(
            100,
            player.x - 300
        );


    player.y = 100;

    player.velocityX = 0;

    player.velocityY = 0;
}


/* =========================================================
   COINS
========================================================= */

function checkCoins() {

    const coinElements =
        document.querySelectorAll(
            "[data-coin]"
        );


    const playerRect =
        getPlayerRect();


    coinElements.forEach(
        function(coin) {

            if (
                coin.dataset.collected ===
                "true"
            ) {

                return;
            }


            const coinRect =
                getWorldRect(coin);


            if (
                rectanglesOverlap(
                    playerRect,
                    coinRect
                )
            ) {

                coin.dataset.collected =
                    "true";

                coin.style.display =
                    "none";


                coins++;

                score += 50;

                updateHUD();
            }

        }
    );
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    const screenCenter =
        game.clientWidth / 2;


    let targetCamera =
        player.x -
        screenCenter;


    const maxCamera =
        Math.max(
            0,
            5000 -
            game.clientWidth
        );


    targetCamera =
        Math.max(
            0,
            Math.min(
                targetCamera,
                maxCamera
            )
        );


    cameraCurrent +=
        (
            targetCamera -
            cameraCurrent
        ) * 0.12;


    world.style.transform =
        `translate3d(
            ${-cameraCurrent}px,
            0,
            0
        )`;
}


/* =========================================================
   FINISH
========================================================= */

function checkFinish() {

    if (
        player.x >= 4350
    ) {

        levelComplete();
    }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    scoreElement.textContent =
        score;

    coinsElement.textContent =
        coins;

    livesElement.textContent =
        lives;
}


/* =========================================================
   RENDER MARIO
========================================================= */

function renderPlayer() {

    playerElement.style.left =
        player.x + "px";

    playerElement.style.top =
        player.y + "px";


    /*
       Direction
    */

    if (
        player.facing === -1
    ) {

        playerElement.style.transform =
            "scaleX(-1)";

    } else {

        playerElement.style.transform =
            "scaleX(1)";
    }


    /*
       Walking
    */

    if (
        player.velocityX !== 0 &&
        player.grounded
    ) {

        playerElement.classList.add(
            "walking"
        );

    } else {

        playerElement.classList.remove(
            "walking"
        );
    }
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    gameRunning = false;


    messageTitle.textContent =
        "GAME OVER";


    messageText.textContent =
        "Score: " +
        score;


    message.style.display =
        "block";
}


/* =========================================================
   LEVEL COMPLETE
========================================================= */

function levelComplete() {

    if (!gameRunning) {

        return;
    }


    gameRunning = false;


    messageTitle.textContent =
        "LEVEL COMPLETE!";


    messageText.textContent =
        "Score: " +
        score +
        " | Coins: " +
        coins;


    message.style.display =
        "block";
}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    location.reload();
}


/* =========================================================
   UPDATE
========================================================= */

function update() {

    handleInput();

    updateHorizontalMovement();

    updateVerticalMovement();

    updateEnemies();

    checkEnemyCollision();

    checkCoins();

    checkFinish();

    updateCamera();

    renderPlayer();
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    if (gameRunning) {

        update();
    }


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   START
========================================================= */

function startGame() {

    player.y =
        game.clientHeight -
        90 -
        player.height;


    player.grounded = true;


    updateHUD();

    renderPlayer();

    gameLoop();
}


startGame();

</script>
